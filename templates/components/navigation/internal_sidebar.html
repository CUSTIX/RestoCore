<aside class="internal-sidebar" aria-label="Application navigation">
  <a class="brand" href="{% url 'website:home' %}">RestoCore</a>
  {% if items %}
    <nav aria-label="Primary">
      <ul>
        {% for item in items %}
          <li><a href="{% url item.url_name %}">{{ item.label }}</a></li>
        {% endfor %}
      </ul>
    </nav>
  {% endif %}
</aside>
