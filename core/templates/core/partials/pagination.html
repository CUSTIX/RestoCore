{% load core %}
{% if page_obj.paginator.num_pages > 1 %}
<nav class="pagination" aria-label="Pagination">
  {% if page_obj.has_previous %}
    <a href="?{% query_with page=page_obj.previous_page_number %}">&larr; Previous</a>
  {% endif %}
  <span>Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }} · {{ page_obj.paginator.count }} total</span>
  {% if page_obj.has_next %}
    <a href="?{% query_with page=page_obj.next_page_number %}">Next &rarr;</a>
  {% endif %}
</nav>
{% endif %}
