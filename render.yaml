# Render Blueprint: the live demo. Render builds the Dockerfile's last stage (`prod`) and runs
# bin/start.sh. The database is external (Neon free Postgres): paste its connection string as
# DATABASE_URL when Render asks. Nothing secret lives in this file. See docs/deploy.md.
services:
  - type: web
    name: restocore
    runtime: docker
    plan: free
    region: singapore
    autoDeploy: true
    healthCheckPath: /healthz/
    envVars:
      - key: DATABASE_URL
        sync: false # prompted in the dashboard, never committed
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEMO_PASSWORD
        value: restocore-demo
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_HTTPS
        value: "true"
      - key: DJANGO_STATIC_MANIFEST
        value: "true"
      - key: DJANGO_TIME_ZONE
        value: Asia/Manila
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_RESET_ON_START
        value: "true"
      - key: DEMO_RESET_HOUR
        value: "4" # nightly reset at 4 AM Manila (the service is kept awake)
      - key: CLIENT_IP_HEADER
        value: HTTP_CF_CONNECTING_IP # Cloudflare (in front of Render) overwrites this header
      - key: GEMINI_API_KEY
        sync: false # optional: turns on Ask RestoCore; free key from Google AI Studio
      - key: WEB_CONCURRENCY
        value: "2" # free instance has 512 MB of RAM
