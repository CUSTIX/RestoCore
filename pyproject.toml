[project]
name = "restocore"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import order, B: bugbear, UP: modern syntax, DJ: Django checks
select = ["E", "F", "I", "B", "UP", "DJ"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = [
    "tests", "core", "accounts", "dashboard", "website", "bookings", "inventory", "sales",
    "staff", "payroll", "api", "mcp_server",
]
python_files = ["test_*.py"]
# STATIC_ROOT only exists in the prod image (collectstatic at build); that is expected in tests.
filterwarnings = ["ignore:No directory at:UserWarning"]
