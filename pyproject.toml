[project]
name = "restocore"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import order, B: bugbear, UP: modern syntax, DJ: Django checks,
# S: security (flake8-bandit: eval, shell=True, unsafe deserialization, weak crypto, mark_safe, ...)
select = ["E", "F", "I", "B", "UP", "DJ", "S"]

[tool.ruff.lint.per-file-ignores]
# Tests: plain `assert` is the point; fixture passwords are fake.
"**/tests/*" = ["S101", "S105", "S106"]
"conftest.py" = ["S101", "S105", "S106"]
# Fake demo data: `random` is fine for picking fake quantities and dates (not security).
"dashboard/management/commands/seed_demo.py" = ["S311"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = [
    "tests", "core", "accounts", "dashboard", "website", "bookings", "inventory", "sales",
    "staff", "payroll", "api", "mcp_server", "assistant",
]
python_files = ["test_*.py"]
# STATIC_ROOT only exists in the prod image (collectstatic at build); that is expected in tests.
filterwarnings = ["ignore:No directory at:UserWarning"]
