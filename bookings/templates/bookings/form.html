{% extends "core/app_base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block page_title %}{{ title }}{% endblock %}
{% block page_actions %}<a href="{% url 'bookings:list' %}">Back to bookings</a>{% endblock %}
{% block content %}
<div class="card">
  <form method="post" novalidate>
    {% csrf_token %}
    {% include "core/partials/form.html" with form=form %}
    <button type="submit" class="btn">Save booking</button>
  </form>
</div>
{% endblock %}
