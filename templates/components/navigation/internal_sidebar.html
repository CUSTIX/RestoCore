<aside class="internal-sidebar" aria-label="Application navigation">
  <div class="internal-sidebar__brand">
    <a class="brand" href="{% url 'core:workspace' %}">
      <span class="brand-mark" aria-hidden="true">RC</span>
      <span>RestoCore</span>
    </a>
  </div>
  {% if items %}
    <nav aria-label="Primary">
      <ul>
        {% for item in items %}
          <li>
            <a
              href="{% url item.url_name %}"
              {% if request.resolver_match.view_name == item.url_name %}
                class="is-active"
                aria-current="page"
              {% endif %}
            >
              {{ item.label }}
            </a>
          </li>
        {% endfor %}
      </ul>
    </nav>
  {% endif %}
</aside>
