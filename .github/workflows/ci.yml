name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

# A newer push to the same branch/PR cancels the older, now-pointless run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    # Same database engine as dev and prod, so tests catch Postgres-specific issues.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: restocore
          POSTGRES_USER: restocore
          POSTGRES_PASSWORD: restocore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U restocore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost
      DJANGO_TIME_ZONE: Asia/Manila
      POSTGRES_DB: restocore
      POSTGRES_USER: restocore
      POSTGRES_PASSWORD: restocore
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest
      - name: Deployment checklist (HTTPS mode, throwaway strong key)
        env:
          DJANGO_HTTPS: "true"
          DJANGO_ALLOWED_HOSTS: example.com
        run: |
          DJANGO_SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(50))')
          export DJANGO_SECRET_KEY
          python manage.py check --deploy --fail-level WARNING

  audit:
    # Fails CI when a pinned dependency has a published vulnerability (PyPI advisory database).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pip-audit==2.9.0
      - name: Audit runtime and dev dependencies
        run: |
          pip-audit -r requirements.txt --progress-spinner off
          pip-audit -r requirements-dev.txt --progress-spinner off

  docker:
    # Fails CI if either image no longer builds. Builds only; nothing is pushed anywhere.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --target dev -t restocore:dev .
      - run: docker build --target prod -t restocore:prod .
