name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - staging

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Django checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: restocore_test
          POSTGRES_USER: restocore
          POSTGRES_PASSWORD: restocore-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U restocore -d restocore_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://restocore:restocore-ci@127.0.0.1:5432/restocore_test
      DJANGO_LOG_LEVEL: WARNING

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install "uv==0.13.2"

      - name: Sync locked dependencies
        run: uv sync --frozen --all-groups

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff formatting
        run: uv run ruff format --check .

      - name: Django system check
        run: uv run python manage.py check --settings=config.settings.test

      - name: Check migration drift
        run: >-
          uv run python manage.py makemigrations
          --check --dry-run
          --settings=config.settings.test

      - name: Run migrations
        run: uv run python manage.py migrate --noinput --settings=config.settings.test

      - name: Run tests
        run: uv run pytest
