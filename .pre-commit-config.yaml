repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff check
        entry: uv run ruff check . --fix
        language: system
        types: [python]
        pass_filenames: false
      - id: ruff-format
        name: Ruff format
        entry: uv run ruff format --check .
        language: system
        types: [python]
        pass_filenames: false
      - id: django-check
        name: Django system check
        entry: uv run python manage.py check --settings=config.settings.test
        language: system
        pass_filenames: false
