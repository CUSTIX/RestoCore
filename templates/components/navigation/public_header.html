<header class="site-header">

      <span class="brand-mark" aria-hidden="true">RC</span>
      <span>RestoCore</span>
    </a>

    <nav class="public-nav" aria-label="Public navigation">
      <a href="{% url 'website:home' %}#showcase">Showcase</a>
      <a href="{% url 'booking_public:create' %}">Booking</a>
      <a href="{% url 'website:home' %}#about">About</a>

      {% else %}
        <a class="public-nav__action" href="{% url 'accounts:login' %}">Login</a>
      {% endif %}
    </nav>

</header>
