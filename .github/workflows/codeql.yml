name: CodeQL

# GitHub's static analysis (free for public repos): looks for injection, XSS, path traversal,
# unsafe deserialization and similar bugs in the Python and JavaScript code. Findings appear
# under the repo's Security tab.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1" # weekly, so new CodeQL rules also check unchanged code

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload results to the Security tab
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
